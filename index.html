<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIPTEC - Iniciar sesión</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="shortcut icon" href="img/LogoSIPTEC.png" type="image/x-icon">
</head>

<body>

    <div class="marco-movil">
        <div id="view-login" class="pantalla-login">
            <div class="tarjeta-login">
                <div class="marcador-logo">
                    <img src="img/LogoSIPTEC.png" alt="Logo"
                        style="width: 100%; height: 100%; object-fit: contain; border-radius: 50%;">
                </div>
                <h2>BIENVENIDO A SIPTEC</h2>
                <p class="subtitulo-login">Sistema de préstamo e inventario de área técnica</p>
                <p class="instruccion">Ingresa tus credenciales para acceder al sistema</p>

                <form id="login-form">
                    <div class="grupo-campo-login">
                        <label for="email">Correo electrónico</label>
                        <input type="email" id="email" required placeholder="ejemplo@ricaldone.edu.sv">
                    </div>

                    <div class="grupo-campo-login">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" required placeholder="••••••••">
                    </div>

                    <button type="submit" class="boton-iniciar-sesion">Iniciar Sesión</button>
                </form>

                <p class="pie-login">
                    Desarrollado por el departamento de Desarrollo de Software del Instituto Técnico Ricaldone
                </p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="js/controllers/loginController.js"></script>
</body>

</html>
