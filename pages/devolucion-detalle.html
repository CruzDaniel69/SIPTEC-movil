<div class="encabezado">
    <div class="grupo-titulo-volver">
        <button type="button" class="boton-volver" id="btnVolverDevoluciones"><i class="fa-solid fa-arrow-left"></i></button>
        <h1>Devolución</h1>
    </div>
    <button type="button" class="boton-perfil-topbar" id="btnAbrirPerfil">
        <span class="nombre-perfil-topbar" id="nombreUsuarioTopbar"></span>
        <i class="fa-solid fa-chevron-down"></i>
    </button>
</div>

<div class="caja-tarjeta">
    <div class="titulo-tarjeta" id="tituloPrestamoDevolucion">Préstamo</div>
    <div class="datos-prestamo" id="datosPrestamoDevolucion"></div>
</div>

<div class="caja-tarjeta">
    <div class="titulo-tarjeta">Estado del equipo</div>
    <div class="estado-equipo" id="estadoEquipo">
        <i class="fa-solid fa-circle-check"></i>
        <span id="textoEstadoEquipo">Todo vuelve en buen estado</span>
    </div>
    <button type="button" class="boton-accion-contorno" id="btnReportarDano"><i class="fa-solid fa-triangle-exclamation"></i> Reportar daño</button>
</div>

<div class="caja-tarjeta">
    <div class="titulo-tarjeta">Observaciones (opcional)</div>
    <textarea class="caja-area-texto" id="observacionesDevolucion" placeholder="Escribe aquí..." maxlength="150"
        oninput="document.getElementById('c2').innerText = this.value.length"></textarea>
    <div class="contador-caracteres"><span id="c2">0</span>/150</div>
</div>

<div class="caja-tarjeta">
    <div class="titulo-tarjeta">Foto de evidencia (opcional)</div>
    <label class="caja-subir-foto" for="evidenciaDevolucion" id="cajaEvidencia">
        <img class="vista-previa-foto" id="vistaEvidencia" alt="Vista previa de la foto">
        <i class="fa-solid fa-camera"></i>
        <div class="textos-subir">
            <span id="textoEvidencia">Tomar o elegir una foto</span>
            <small>Máx. 5 MB</small>
        </div>
        <button type="button" class="quitar-foto" id="quitarEvidencia" aria-label="Quitar foto"><i class="fa-solid fa-xmark"></i></button>
    </label>
    <input type="file" class="campo-archivo-oculto" id="evidenciaDevolucion" accept="image/jpeg,image/png,image/webp">
</div>

<button class="boton-accion-verde" id="btnRegistrarDevolucion">Registrar devolución</button>
