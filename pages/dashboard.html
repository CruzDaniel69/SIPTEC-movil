<div class="encabezado">
    <h1>¡Bienvenido,<br>Empleado!</h1>
    <button type="button" class="boton-perfil-topbar" id="btnAbrirPerfil">
        <span class="nombre-perfil-topbar" id="nombreUsuarioTopbar"></span>
        <i class="fa-solid fa-circle-user"></i>
    </button>
</div>
<div class="subtitulo-encabezado">Resumen general del sistema</div>

<div class="caja-tarjeta">
    <div class="titulo-tarjeta">Resumen rápido</div>
    <div class="cuadricula-2">
        <div class="tarjeta-estadistica fondo-azul">
            <i class="fa-solid fa-cube"></i>
            <span class="number" id="statEquiposPrestados">0</span>
            <span class="label">Equipos prestados</span>
        </div>
        <div class="tarjeta-estadistica fondo-verde">
            <i class="fa-solid fa-arrows-rotate"></i>
            <span class="number" id="statDevolucionesPendientes">0</span>
            <span class="label">Devoluciones pendientes</span>
        </div>
        <div class="tarjeta-estadistica fondo-naranja">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <span class="number" id="statEquiposDanados">0</span>
            <span class="label">Equipos con daño</span>
        </div>
        <div class="tarjeta-estadistica fondo-morado">
            <i class="fa-solid fa-circle-check"></i>
            <span class="number" id="statEquiposDisponibles">0</span>
            <span class="label">Equipos disponibles</span>
        </div>
    </div>
</div>

<div class="caja-tarjeta">
    <div class="titulo-tarjeta">Accesos rápidos</div>
    <div class="cuadricula-4">
        <button class="tarjeta-accion text-blue" onclick="loadView('loans')">
            <i class="fa-solid fa-circle-plus"></i>
            Nuevo préstamo
        </button>
        <button class="tarjeta-accion text-green" onclick="loadView('devolucion')">
            <i class="fa-solid fa-rotate-left"></i>
            Registrar devolución
        </button>
        <button class="tarjeta-accion text-purple" onclick="loadView('agregar-implemento')">
            <i class="fa-solid fa-box"></i>
            Agregar implemento
        </button>
        <button class="tarjeta-accion text-orange" onclick="loadView('devolucion', 'estadoDanado')">
            <i class="fa-solid fa-triangle-exclamation"></i>
            Reportar daño
        </button>
    </div>
</div>

<div class="caja-tarjeta">
    <div class="titulo-tarjeta">Préstamos activos</div>

    <div id="listaPrestamosActivos"></div>
</div>
