<div class="encabezado">
    <h1>Registro de devolución</h1>
    <button type="button" class="boton-perfil-topbar" id="btnAbrirPerfil">
        <span class="nombre-perfil-topbar" id="nombreUsuarioTopbar"></span>
        <i class="fa-solid fa-chevron-down"></i>
    </button>
</div>

<div class="caja-tarjeta">
    <div class="titulo-tarjeta">1. Seleccionar equipo</div>
    <div class="caja-buscador">
        <input type="text" id="equipoCodigo" placeholder="Escanea el código del equipo" autocomplete="off" autocapitalize="characters" spellcheck="false">
        <i class="fa-solid fa-magnifying-glass"></i>
    </div>
    <a class="enlace-azul-centrado" id="btnBuscarManual">Buscar manualmente</a>
</div>

<div class="caja-tarjeta">
    <div class="titulo-tarjeta">2. Fecha y hora de devolución</div>
    <input type="datetime-local" class="campo-fecha" id="fechaDevolucion" style="width:100%;" required>
</div>

<div class="caja-tarjeta">
    <div class="titulo-tarjeta">3. Estado del equipo</div>
    <div class="grupo-radio" id="estadoEquipoGroup">
        <label class="item-radio">
            <input type="radio" name="estadoEquipo" id="estadoDisponible" value="DISPONIBLE" checked>
            <span class="circulo-radio"></span>
            En buen estado
        </label>
        <label class="item-radio">
            <input type="radio" name="estadoEquipo" id="estadoDanado" value="DAÑADO">
            <span class="circulo-radio"></span>
            Con daño
        </label>
    </div>
</div>

<div class="caja-tarjeta">
    <div class="titulo-tarjeta">4. Observaciones (opcional)</div>
    <textarea class="caja-area-texto" placeholder="Escribe observaciones..." maxlength="150"
        oninput="document.getElementById('c2').innerText = this.value.length"></textarea>
    <div class="contador-caracteres"><span id="c2">0</span>/150</div>
</div>

<div class="caja-tarjeta">
    <div class="titulo-tarjeta">5. Foto de evidencia (opcional)</div>
    <label class="caja-subir-foto" for="evidenciaDevolucion" id="cajaEvidencia">
        <img class="vista-previa-foto" id="vistaEvidencia" alt="Vista previa de la foto">
        <i class="fa-solid fa-camera"></i>
        <div class="textos-subir">
            <span id="textoEvidencia">Tomar o elegir una foto</span>
            <small>JPG, PNG o WEBP · máximo 5 MB</small>
        </div>
        <button type="button" class="quitar-foto" id="quitarEvidencia" aria-label="Quitar foto"><i class="fa-solid fa-xmark"></i></button>
    </label>
    <input type="file" class="campo-archivo-oculto" id="evidenciaDevolucion" accept="image/jpeg,image/png,image/webp">
</div>

<button class="boton-accion-verde" id="btnRegistrarDevolucion">Registrar devolución</button>
