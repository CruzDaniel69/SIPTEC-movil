<div class="encabezado">
    <h1>Agregar implemento</h1>
    <button type="button" class="boton-perfil-topbar" id="btnAbrirPerfil">
        <span class="nombre-perfil-topbar" id="nombreUsuarioTopbar"></span>
        <i class="fa-solid fa-circle-user"></i>
    </button>
</div>
<div class="subtitulo-encabezado">Registrar un nuevo implemento o equipo al inventario</div>

<div class="caja-tarjeta">
    <div class="titulo-tarjeta">1. Nombre del equipo</div>
    <input type="text" id="nombreEquipo" placeholder="Escribe el nombre del equipo" class="campo-simple" required>
</div>

<div class="caja-tarjeta">
    <div class="titulo-tarjeta">2. Código de inventario</div>
    <div style="display:flex; gap:8px;">
        <select id="prefijoCodigo" class="campo-simple" style="flex:0 0 30%;">
            <option value="EQ" selected>EQ</option>
            <option value="HE">HE</option>
            <option value="TAL">TAL</option>
            <option value="LAB">LAB</option>
        </select>
        <input type="number" id="numeroCodigo" min="1" step="1" placeholder="Número (ej. 21)" class="campo-simple" required>
    </div>
    <label style="display:block; margin-top:10px; margin-bottom:6px; font-size:10px; font-weight:700; color:var(--ink-soft); text-transform:uppercase;">Piezas</label>
    <input type="number" id="cantidadPiezas" min="1" max="50" step="1" value="1" class="campo-simple" required>
    <small id="vistaPreviaCodigos" style="display:block; margin-top:4px; font-size:9px; color:var(--ink-soft);">Se creará un código por cada pieza (ej. EQ-21, EQ-22…).</small>
</div>

<div class="caja-tarjeta">
    <div class="titulo-tarjeta">3. Marca</div>
    <select id="marcaTexto" class="campo-simple" required>
        <option value="" disabled selected>Selecciona una opción</option>
    </select>
</div>

<div class="caja-tarjeta">
    <div class="titulo-tarjeta">4. Categoría</div>
    <select id="categoriaTexto" class="campo-simple" required>
        <option value="" disabled selected>Selecciona una opción</option>
    </select>
</div>

<div class="caja-tarjeta">
    <div class="titulo-tarjeta">5. Descripción (opcional)</div>
    <textarea class="caja-area-texto" id="descripcionEquipo" placeholder="Escribe una descripción..." maxlength="150"
        oninput="document.getElementById('c3').innerText = this.value.length"></textarea>
    <div class="contador-caracteres"><span id="c3">0</span>/150</div>
</div>

<button class="boton-accion-morado" id="btnGuardarImplemento">Guardar implemento</button>
